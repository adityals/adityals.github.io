name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Minify into dist/
        run: |
          mkdir dist
          npx --yes html-minifier-terser@7 \
            --collapse-whitespace --conservative-collapse \
            --remove-comments --minify-css true \
            index.html -o dist/index.html
          npx --yes lightningcss-cli@1 --minify styles.css -o dist/styles.css
          cp CNAME dist/CNAME

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
